<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Painel de correção digital do CertameTech</title>
  <desc id="desc">Interface conceitual baseada no sistema real, com prova digitalizada, marcações de correção, critérios de avaliação e histórico da coordenação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1b3046"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#081018" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="80" r="240" fill="#2f6d9e" opacity=".12"/>
  <circle cx="160" cy="850" r="270" fill="#2f9b86" opacity=".1"/>

  <rect x="0" y="0" width="1600" height="64" fill="#171b1f"/>
  <text x="70" y="40" fill="#f7fafc" font-family="Arial, sans-serif" font-size="23" font-weight="700">UniFil Concursos</text>
  <g fill="#aeb8c2" font-family="Arial, sans-serif" font-size="14">
    <text x="355" y="39">Cadastros</text><text x="455" y="39">Buscas</text><text x="530" y="39">Etapas</text><text x="610" y="39">Homologação</text><text x="740" y="39">Ensalamento</text><text x="850" y="39">Cálculos</text><text x="930" y="39">Importações</text><text x="1045" y="39">Relatórios</text><text x="1145" y="39">Correções</text><text x="1240" y="39">Configurações</text>
  </g>
  <text x="1450" y="39" fill="#f0c36a" font-family="Arial, sans-serif" font-size="14">Área da Coordenação</text>

  <rect x="64" y="104" width="1472" height="720" rx="14" fill="#edf1f4" filter="url(#shadow)"/>
  <rect x="64" y="104" width="72" height="720" rx="14" fill="#13283e"/>
  <g fill="none" stroke="#aac0d2" stroke-width="3" opacity=".85">
    <path d="M87 155l13-11 13 11v14H87z"/><circle cx="100" cy="230" r="13"/><path d="M86 256c4-14 24-14 28 0M91 313h18M91 330h18M91 347h12"/><rect x="87" y="388" width="26" height="30" rx="2"/><path d="M93 400h14M93 408h14"/><circle cx="100" cy="470" r="13"/><path d="M100 451v38M81 470h38"/>
  </g>
  <rect x="80" y="370" width="40" height="64" rx="7" fill="#2b6598" opacity=".8"/>

  <rect x="136" y="104" width="1400" height="76" fill="#ffffff"/>
  <text x="168" y="137" fill="#24394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Correção da prova #76</text>
  <text x="168" y="160" fill="#71808c" font-family="Arial, sans-serif" font-size="12">Avaliador: Gustavo Farias  ·  Status: Em andamento</text>
  <rect x="1194" y="126" width="136" height="34" rx="5" fill="#2b6598"/><text x="1214" y="148" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">Salvar correção</text>
  <rect x="1350" y="126" width="154" height="34" rx="5" fill="#eef2f5"/><text x="1370" y="148" fill="#3f5261" font-family="Arial, sans-serif" font-size="12">Voltar para provas</text>

  <rect x="160" y="204" width="820" height="578" rx="7" fill="#cbd3d9"/>
  <rect x="188" y="224" width="764" height="535" fill="#fffdf8" stroke="#d9d4ca"/>
  <g stroke="#c6d0d8" stroke-width="2" opacity=".9">
    <path d="M230 290h660M230 330h660M230 370h660M230 410h660M230 450h660M230 490h660M230 530h660M230 570h660M230 610h660M230 650h660M230 690h660"/>
  </g>
  <g fill="#567aa5" font-family="Georgia, serif" font-size="21" font-style="italic" opacity=".9">
    <text x="230" y="278">As mudanças tecnológicas transformaram a forma</text><text x="230" y="318">como os seres humanos interagem entre si e com o mundo.</text><text x="230" y="358">A tecnologia tornou-se parte essencial da existência humana.</text><text x="230" y="398">Nesse sentido, cabe analisar seus benefícios para o setor público.</text><text x="230" y="438">Em primeiro lugar, o documento digitalizado oferece</text><text x="230" y="478">benefícios evidentes para a organização das correções.</text><text x="230" y="518">Além disso, as informações podem ser transmitidas</text><text x="230" y="558">entre os órgãos públicos com mais agilidade e controle.</text><text x="230" y="598">Por fim, tornam-se evidentes impactos positivos no setor público.</text><text x="230" y="638">A avaliação reúne critérios, comentários e nota final.</text>
  </g>
  <rect x="228" y="254" width="330" height="31" rx="3" fill="#ff8989" opacity=".46" stroke="#f25f67" stroke-width="2"/>
  <rect x="425" y="380" width="260" height="27" rx="3" fill="#ffe66d" opacity=".65"/>
  <rect x="646" y="500" width="255" height="27" rx="3" fill="#91dfbe" opacity=".6"/>
  <g>
    <rect x="910" y="273" width="34" height="28" rx="6" fill="#ff777d"/><path d="M918 283h18M918 289h12" stroke="#fff" stroke-width="2"/>
    <rect x="838" y="495" width="34" height="28" rx="6" fill="#f0b72f"/><path d="M846 505h18M846 511h12" stroke="#fff" stroke-width="2"/>
  </g>

  <rect x="1010" y="204" width="488" height="578" rx="7" fill="#fff"/>
  <text x="1042" y="250" fill="#24394a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Critérios de Avaliação</text>
  <text x="1042" y="278" fill="#657583" font-family="Arial, sans-serif" font-size="16">Discursiva</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="1042" y="305" width="424" height="54" rx="5" fill="#ff8989"/><text x="1058" y="337" fill="#24313a">Atendimento ao tema proposto</text><rect x="1370" y="317" width="78" height="30" rx="3" fill="#fff"/><text x="1392" y="337" fill="#24313a">5,00</text>
    <rect x="1042" y="371" width="424" height="54" rx="5" fill="#d9d9d9"/><text x="1058" y="403" fill="#24313a">Clareza e senso crítico</text><rect x="1370" y="383" width="78" height="30" rx="3" fill="#fff"/><text x="1392" y="403" fill="#24313a">10,00</text>
    <rect x="1042" y="437" width="424" height="54" rx="5" fill="#f4b4da"/><text x="1058" y="469" fill="#24313a">Seletividade de informação</text><rect x="1370" y="449" width="78" height="30" rx="3" fill="#fff"/><text x="1392" y="469" fill="#24313a">10,00</text>
    <rect x="1042" y="503" width="424" height="54" rx="5" fill="#ffe98b"/><text x="1058" y="535" fill="#24313a">Criatividade e originalidade</text><rect x="1370" y="515" width="78" height="30" rx="3" fill="#fff"/><text x="1392" y="535" fill="#24313a">5,00</text>
  </g>
  <text x="1042" y="603" fill="#24394a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Histórico e parecer</text>
  <rect x="1042" y="625" width="424" height="68" rx="5" fill="#f0f3f5"/><circle cx="1062" cy="647" r="6" fill="#2b6598"/><text x="1080" y="652" fill="#465866" font-family="Arial, sans-serif" font-size="13">Correção salva · nota parcial 45,00 / 50,00</text><text x="1080" y="676" fill="#82909a" font-family="Arial, sans-serif" font-size="12">Coordenação poderá validar o resultado</text>
  <rect x="1042" y="713" width="190" height="34" rx="5" fill="#2c945d"/><text x="1065" y="735" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Enviar para validação</text>
  <rect x="1250" y="713" width="216" height="34" rx="5" fill="#edf1f4"/><text x="1275" y="735" fill="#425564" font-family="Arial, sans-serif" font-size="13">Adicionar observação</text>
</svg>
